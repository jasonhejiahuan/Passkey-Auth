server {
    listen 80;
    listen [::]:80;
    server_name auth.jasonstu.cc;
    access_log off;
    error_log /var/log/nginx/jason-auth-error.log crit;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/jason-auth-acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 301 https://auth.jasonstu.cc$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name auth.jasonstu.cc;
    ssl_certificate /etc/letsencrypt/live/auth.jasonstu.cc/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/auth.jasonstu.cc/privkey.pem;
    include /etc/nginx/snippets/jason-auth-real-ip.conf;
    access_log off;
    error_log /var/log/nginx/jason-auth-error.log crit;
    client_max_body_size 1m;
    location /static/ {
        alias /opt/jason-passkey-auth/current/jstu_passkey/static/;
        expires 1d;
        add_header X-Content-Type-Options nosniff always;
    }
    location / {
        add_header Cache-Control "no-store" always;
        proxy_pass http://127.0.0.1:5013;
        proxy_set_header Host auth.jasonstu.cc;
        proxy_set_header X-Forwarded-Host auth.jasonstu.cc;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Connection "";
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 75s;
        proxy_hide_header Server;
    }
}
